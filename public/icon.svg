<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle/Shield -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="8" filter="url(#glow)" opacity="0.8" />

  <!-- IEEE Diamond Kite Shape -->
  <polygon points="256,70 410,256 256,442 102,256" fill="url(#diamond)" filter="url(#glow)" />
  <polygon points="256,95 385,256 256,417 127,256" fill="#030712" />

  <!-- IEEE Lightning Bolt / Arrow -->
  <polygon points="256,120 300,240 265,240 280,360 215,225 250,225" fill="#38bdf8" filter="url(#glow)" />

  <!-- NISB Text Emblem -->
  <text x="256" y="400" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="6">NISB</text>
  <text x="256" y="435" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="8">IEEE</text>
</svg>
